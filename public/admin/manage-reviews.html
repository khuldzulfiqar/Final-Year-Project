<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Reviews</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/admin-css/admin-dashboard.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <button class="toggle-btn" id="toggleBtn">
    <span></span><span></span><span></span>
  </button>

  <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>

  <div class="nav-right">
    <button class="avatar-btn" id="avatarBtn">A</button>

    <div class="avatar-dropdown" id="avatarDropdown">
      <div class="dropdown-user">
        <p>Admin</p>
        <span>admin@mindbridge.com</span>
      </div>

      <div class="dropdown-item logout-item" id="dropdownLogout">
        <i class="ti ti-logout"></i> Logout
      </div>
    </div>
  </div>
</nav>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-section">
      <label>Main</label>
      <a href="/admin/admin-dashboard.html" class="nav-link">
        <i class="ti ti-layout-dashboard"></i> Dashboard
      </a>
    </div>

    <div class="sidebar-section">
      <label>Management</label>

      <a href="/admin/manage-patients.html" class="nav-link">
        <i class="ti ti-users"></i> Patients
      </a>

      <a href="/admin/manage-psychiatrists.html" class="nav-link">
        <i class="ti ti-user-heart"></i> Psychiatrists
      </a>

      <a href="/admin/manage-appointments.html" class="nav-link">
        <i class="ti ti-calendar-event"></i> Appointments
      </a>

      <a href="/admin/manage-reviews.html" class="nav-link active">
        <i class="ti ti-star"></i> Reviews
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="logout-link" id="logoutBtn">
        <i class="ti ti-logout"></i> Logout
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main-content" id="mainContent">

    <div class="page-header">
      <h1> Reviews</h1>
      <p>Monitor patient feedback</p>
    </div>

    <div style="margin-bottom:20px;">
      <input type="text" id="searchInput"
        placeholder="Search reviews..."
        style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div class="card">
      <table id="reviewTable" style="width:100%; border-collapse: collapse;">
        <thead>
          <tr style="text-align:left; font-size:13px; color:#888;">
            <th style="padding:10px;">Patient</th>
            <th style="padding:10px;">Psychiatrist</th>
            <th style="padding:10px;">Rating</th>
            <th style="padding:10px;">Review</th>
            <th style="padding:10px;">Date</th>
            <th style="padding:10px;">Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<script src="../js/manage-reviews.js"></script>
</body>
</html>
