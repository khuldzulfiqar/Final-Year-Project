<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Appointments — MindBridge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/admin-css/admin-dashboard.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <button class="toggle-btn" id="toggleBtn">
      <span></span><span></span><span></span>
    </button>
    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>
    <div class="nav-right">
      <button class="avatar-btn" id="avatarBtn">A</button>
      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="dropdown-user">
          <p>Admin</p>
          <span>admin@mindbridge.com</span>
        </div>
        <div class="dropdown-item logout-item" id="dropdownLogout">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>
    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <label>Main</label>
        <a href="/admin/admin-dashboard.html" class="nav-link">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
      </div>
      <div class="sidebar-section">
        <label>Management</label>
        <a href="/admin/manage-patients.html" class="nav-link">
          <i class="ti ti-users"></i> Patients
        </a>
        <a href="/admin/manage-psychiatrists.html" class="nav-link">
          <i class="ti ti-user-heart"></i> Psychiatrists
        </a>
        <a href="/admin/manage-appointments.html" class="nav-link active">
          <i class="ti ti-calendar-event"></i> Appointments
        </a>
        <a href="/admin/manage-reviews.html" class="nav-link">
          <i class="ti ti-star"></i> Reviews
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="logout-link" id="logoutBtn">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">

      <div class="page-header">
        <h1>Appointments</h1>
        <p>Filter and manage all patient appointments</p>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="search-wrap" style="flex:1;">
          <i class="ti ti-search"></i>
          <input type="text" id="searchInput" placeholder="Search by patient or psychiatrist…">
        </div>
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="card">
        <table id="appointmentTable">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Psychiatrist</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="../js/manage-appointment.js"></script>
</body>
</html>
