<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Patients</title>

  <!-- Icons + Same CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/admin-css/admin-dashboard.css">
</head>

<body>

  <!-- ✅ NAVBAR -->
  <nav class="navbar">
    <button class="toggle-btn" id="toggleBtn">
      <span></span><span></span><span></span>
    </button>

    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>

    <div class="nav-right">
      <button class="avatar-btn" id="avatarBtn">A</button>

      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="dropdown-user">
          <p>Admin</p>
          <span>admin@mindbridge.com</span>
        </div>

        <div class="dropdown-item logout-item" id="dropdownLogout">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>
    </div>
  </nav>

  <!-- ✅ LAYOUT -->
  <div class="layout">

    <!-- ✅ SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-section">
        <label>Main</label>
        <a href="/admin/admin-dashboard.html" class="nav-link">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
      </div>

      <div class="sidebar-section">
        <label>Management</label>

        <a href="/admin/manage-patients.html" class="nav-link active">
          <i class="ti ti-users"></i> Patients
        </a>

        <a href="/admin/manage-psychiatrists.html" class="nav-link">
          <i class="ti ti-user-heart"></i> Psychiatrists
        </a>

        <a href="/admin/manage-appointments.html" class="nav-link">
          <i class="ti ti-calendar-event"></i> Appointments
        </a>

        <a href="/admin/manage-reviews.html" class="nav-link">
          <i class="ti ti-star"></i>  Reviews
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="logout-link" id="logoutBtn">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>

    </aside>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content" id="mainContent">

      <div class="page-header">
        <h1> Patients</h1>
        <p>Search, view and manage patients</p>
      </div>

      <!-- 🔍 SEARCH -->
      <div style="margin-bottom:20px;">
        <input type="text" id="search"
          placeholder="Search by name or email..."
          style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
      </div>

      <!-- 📋 TABLE CARD -->
      <div class="card">
        <table id="patientsTable" style="width:100%; border-collapse: collapse;">
          <thead>
            <tr style="text-align:left; font-size:13px; color:#888;">
              <th style="padding:10px;">Name</th>
              <th style="padding:10px;">Email</th>
              <th style="padding:10px;">Profile</th>
              <th style="padding:10px;">Delete</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="../js/patients.js"></script>
</body>
</html>
