<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Psychiatrists — MindBridge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/admin-css/admin-dashboard.css">
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
    }
    .modal-header h2 { margin:0; font-size:1.05rem; font-weight:700; color:#1a1a2e; }
    .modal-close {
      background: none; border: none;
      font-size: 1.3rem; cursor: pointer;
      color: #888; padding: 4px 8px;
      border-radius: 6px; line-height:1;
    }
    .modal-close:hover { background:#f0f0f0; color:#333; }
    .modal-body { padding: 20px 22px 24px; }
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .profile-field {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .profile-field.highlight {
      border: 1.5px solid #0d7377;
      background: #f0fafa;
    }
    .profile-field .field-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }
    .profile-field .field-value {
      font-size: 0.9rem;
      font-weight: 500;
      color: #1a1a2e;
    }
    .profile-field.highlight .field-value { color: #0d7377; font-weight: 700; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .btn-approve-modal {
      background: #16a34a; color: #fff;
      border: none; padding: 8px 22px;
      border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem;
    }
    .btn-reject-modal {
      background: #dc2626; color: #fff;
      border: none; padding: 8px 22px;
      border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <button class="toggle-btn" id="toggleBtn">
      <span></span><span></span><span></span>
    </button>
    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>
    <div class="nav-right">
      <button class="avatar-btn" id="avatarBtn">A</button>
      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="dropdown-user">
          <p>Admin</p>
          <span>admin@mindbridge.com</span>
        </div>
        <div class="dropdown-item logout-item" id="dropdownLogout">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <label>Main</label>
        <a href="/admin/admin-dashboard.html" class="nav-link">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
      </div>
      <div class="sidebar-section">
        <label>Management</label>
        <a href="/admin/manage-patients.html" class="nav-link">
          <i class="ti ti-users"></i> Patients
        </a>
        <a href="/admin/manage-psychiatrists.html" class="nav-link active">
          <i class="ti ti-user-heart"></i> Psychiatrists
        </a>
        <a href="/admin/manage-appointments.html" class="nav-link">
          <i class="ti ti-calendar-event"></i> Appointments
        </a>
        <a href="/admin/manage-reviews.html" class="nav-link">
          <i class="ti ti-star"></i> Reviews
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="logout-link" id="logoutBtn">
          <i class="ti ti-logout"></i> Logout
        </div>
      </div>
    </aside>

    <div class="main-content" id="mainContent">
      <div class="page-header">
        <h1>Psychiatrists</h1>
        <p>Review profiles and approve or reject psychiatrist accounts</p>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <i class="ti ti-search"></i>
          <input type="text" id="searchInput" placeholder="Search psychiatrist…">
        </div>
      </div>

      <div class="card">
        <table id="psyTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Specialization</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>👨‍⚕️ Psychiatrist Profile</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- filled dynamically -->
      </div>
    </div>
  </div>

  <script src="../js/psychiatrist.js"></script>
</body>
</html>
