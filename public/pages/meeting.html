<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Consultation - MindBridge</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body { height:100%; margin:0; }
    body { display:flex; flex-direction:column; background:var(--cream); font-family:'DM Sans',sans-serif; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--border); }
    .bar .title { font-weight:700; color:var(--teal); }
    .bar .who { font-size:0.9rem; color:var(--text-muted); }
    .bar a { color:var(--teal); font-weight:600; text-decoration:none; font-size:0.9rem; }
    #stage { flex:1; position:relative; background:#111; min-height:0; }
    #jitsi { position:absolute; inset:0; }
    .msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; background:var(--cream); color:var(--charcoal,#2d3436); }
    .msg h2 { color:var(--teal); margin:0; }
    .msg p { max-width:480px; margin:0; color:var(--text-muted); }
    .btn-open { display:inline-block; background:var(--teal); color:#fff; padding:12px 22px; border-radius:10px; font-weight:600; text-decoration:none; }
    .btn-open:hover { background:var(--teal-dark); }
  </style>
</head>
<body>
  <div class="bar">
    <div><span class="title">🎥 Online Consultation</span> <span class="who" id="who"></span></div>
    <a id="backLink" href="/dashboard">← Back</a>
  </div>
  <div id="stage">
    <div class="msg" id="msg"><h2>Preparing your meeting…</h2></div>
    <div id="jitsi"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const appointmentId = new URLSearchParams(location.search).get('id');
    const msgEl = document.getElementById('msg');

    function showMsg(title, text, extraHtml = '') {
      msgEl.style.display = 'flex';
      msgEl.innerHTML = `<h2>${title}</h2><p>${text}</p>${extraHtml}`;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = resolve; s.onerror = () => reject(new Error('Could not load the video service'));
        document.head.appendChild(s);
      });
    }

    async function start() {
      if (!Auth.isLoggedIn()) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
      if (!appointmentId) { showMsg('Meeting not found', 'This link is incomplete.'); return; }

      let data;
      try { data = await apiCall(`/api/appointments/${appointmentId}/meeting`); }
      catch (e) { showMsg('Connection problem', 'Please check your internet and refresh.'); return; }

      if (!data.success) {
        const back = Auth.isPsychiatrist() ? '/appointments' : '/dashboard';
        showMsg(data.state === 'early' ? '⏳ Not open yet' : 'Cannot join', data.message || 'Meeting is not available.',
          `<a class="btn-open" href="${back}">Go back</a>`);
        // when the room is about to open, retry automatically
        if (data.state === 'early' && data.opensAt) {
          const wait = new Date(data.opensAt) - Date.now();
          if (wait > 0 && wait < 6 * 3600 * 1000) setTimeout(start, wait + 1000);
        }
        return;
      }

      document.getElementById('who').textContent = '· with ' + data.otherName;
      if (data.role === 'psychiatrist') document.getElementById('backLink').href = '/appointments';

      // Fallback (JaaS keys not configured): public Jitsi cannot be embedded, so open it in a new tab
      if (data.provider === 'public') {
        showMsg('Your meeting room is ready', `Meeting with ${data.otherName}. The video call opens in a new tab.`,
          `<a class="btn-open" href="${data.url}" target="_blank" rel="noopener">Open Video Call</a>`);
        return;
      }

      try {
        await loadScript(`https://${data.domain}/${data.appId}/external_api.js`);
        msgEl.style.display = 'none';
        const api = new JitsiMeetExternalAPI(data.domain, {
          roomName: `${data.appId}/${data.room}`,
          jwt: data.jwt,
          parentNode: document.getElementById('jitsi'),
          width: '100%', height: '100%',
          userInfo: { displayName: data.displayName },
          configOverwrite: { disableDeepLinking: true },
          interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false }
        });
        api.addListener('readyToClose', () => {
          location.href = data.role === 'psychiatrist' ? '/appointments' : '/dashboard';
        });
      } catch (e) {
        showMsg('Could not start video', e.message);
      }
    }
    start();
  </script>
</body>
</html>
