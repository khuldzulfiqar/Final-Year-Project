<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – MindBridge</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/admin-css/profile.css">
  <link rel="stylesheet" href="/css/admin-css/admin-dashboard.css">

  <style>
    .badge-psy {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 50px;
      background: #d1fae5;
      color: #065f46;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<!-- NAVBAR (same patient style) -->
<nav class="navbar">
  <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>

  <div class="nav-right">
    <button class="avatar-btn" id="avatarBtn">U</button>

    <div class="avatar-dropdown" id="avatarDropdown">
      <div class="dropdown-user">
        <p id="nav-name">User</p>
        <span id="nav-email">email</span>
      </div>

      <div class="dropdown-item logout-item" id="logoutBtn">
        <i class="ti ti-logout"></i> Logout
      </div>
    </div>
  </div>
</nav>

<!-- PAGE -->
<div class="page">

  <a href="#" onclick="goBack(event)" class="back-link">← Back</a>

  <h2 class="title">My Profile</h2>

  <div class="cardd">

    <div class="avatar-circle" id="avatar-circle">?</div>

    <h3 id="name" class="name">Loading...</h3>

    <span class="badge-psy" id="role-badge">Psychiatrist</span>

    <div class="info">

      <div class="row">
        <span>Email</span>
        <p id="email">—</p>
      </div>

      <div class="row">
        <span>Specialization</span>
        <p id="specialization">—</p>
      </div>

      <div class="row">
        <span>Experience</span>
        <p id="experience">—</p>
      </div>

      <div class="row">
        <span>Qualification</span>
        <p id="qualification">—</p>
      </div>

      <div class="row">
        <span>Phone</span>
        <p id="phone">—</p>
      </div>

      <div class="row">
        <span>Fee</span>
        <p id="fee">—</p>
      </div>

      <div class="row">
        <span>License</span>
        <p id="license">—</p>
      </div>

      <div class="row">
        <span>Member Since</span>
        <p id="since">—</p>
      </div>

    </div>

    <p id="error-msg" class="error-msg" style="display:none;"></p>

  </div>
</div>

<script src="/js/app.js"></script>

<script>
// ================= NAVBAR =================
const avatarBtn = document.getElementById('avatarBtn');
const avatarDropdown = document.getElementById('avatarDropdown');

avatarBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  avatarDropdown.classList.toggle('show');
});

document.addEventListener('click', () => {
  avatarDropdown.classList.remove('show');
});

// ================= LOGOUT =================
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.href = "/";
});

// ================= BACK =================
function goBack(e) {
  e.preventDefault();
  window.location.href = "/dashboard";
}

// ================= LOAD PROFILE =================
async function loadProfile() {
  try {
    const res = await apiCall('/api/auth/me');
    const user = res.user;

    if (!user) throw new Error();

    const initial = user.fullName?.charAt(0).toUpperCase() || "U";

    document.getElementById("avatar-circle").textContent = initial;
    document.getElementById("avatarBtn").textContent = initial;

    document.getElementById("nav-name").textContent = user.fullName;
    document.getElementById("nav-email").textContent = user.email;

    document.getElementById('name').textContent = user.fullName || '—';
    document.getElementById('email').textContent = user.email || '—';
    document.getElementById('specialization').textContent = user.specialization || '—';
    document.getElementById('experience').textContent = user.experience || '—';
    document.getElementById('qualification').textContent = user.qualification || '—';
    document.getElementById('phone').textContent = user.phone || '—';
    document.getElementById('fee').textContent = user.consultationFee ? 'PKR ' + user.consultationFee : '—';
    document.getElementById('license').textContent = user.licenseNumber || '—';
    document.getElementById('since').textContent = user.createdAt
      ? new Date(user.createdAt).toLocaleDateString()
      : '—';

  } catch (err) {
    document.getElementById('name').textContent = 'Failed to load';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = "Could not load profile.";
  }
}

loadProfile();
</script>

</body>
</html>
