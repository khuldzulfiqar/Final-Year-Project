<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – MindBridge</title>
  <link rel="stylesheet" href="/css/admin-css/profile.css">
  <link rel="stylesheet" href="/css/admin-css/admin-dashboard.css">
  <style>
    .avatar-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0067b8, #00b4d8);
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .badge-psy {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.75rem;
      border-radius: 50px;
      margin-bottom: 4px;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.75rem;
      border-radius: 50px;
      margin-bottom: 18px;
    }
    .status-live   { background: #d1fae5; color: #065f46; }
    .status-draft  { background: #fef3c7; color: #92400e; }
    .edit-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #0067b8;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .edit-link:hover { background: #0052a3; }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #0067b8;
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 12px;
    }
    .nav-links {
  display: none !important;
}
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>
    <div class="nav-links" id="dynamic-nav"></div>
  </nav>

  <div class="page">

    <a href="/dashboard" class="back-link">← Back to Dashboard</a>

    <h2 class="title">My Profile</h2>

    <div class="cardd">

      <div class="avatar-circle" id="avatar-circle">D</div>
      <h3 id="name" class="name">Loading...</h3>
      <div><span class="badge-psy">Psychiatrist</span></div>
      <div id="profile-status-badge"></div>

      <div class="info">

        <div class="row">
          <span>Email</span>
          <p id="email">—</p>
        </div>

        <div class="row">
          <span>Specialization</span>
          <p id="specialization">—</p>
        </div>

        <div class="row">
          <span>Experience</span>
          <p id="experience">—</p>
        </div>

        <div class="row">
          <span>Qualification</span>
          <p id="qualification">—</p>
        </div>

        <div class="row">
          <span>Phone</span>
          <p id="phone">—</p>
        </div>

        <div class="row">
          <span>Consultation Fee</span>
          <p id="fee">—</p>
        </div>

        <div class="row">
          <span>License No.</span>
          <p id="license">—</p>
        </div>

        <div class="row">
          <span>Member Since</span>
          <p id="since">—</p>
        </div>

      </div>

      <p id="error-msg" class="error-msg" style="display:none;"></p>

      <a href="/create-profile" class="edit-link">✏️ Update Profile</a>

    </div>

  </div>

  <div id="footer-container"></div>
  <script src="/js/footer.js"></script>
  <script src="/js/app.js"></script>

  <script>
    if (!Auth.isLoggedIn()) {
      window.location.href = '/login';
    }

    async function loadProfile() {
      try {
        const data = await apiCall('/api/auth/me');

        if (!data.success) {
          Auth.clear();
          window.location.href = '/login';
          return;
        }

        const u = data.user;

        // Avatar initial
        const initial = (u.fullName || 'D').charAt(0).toUpperCase();
        document.getElementById('avatar-circle').textContent = initial;

        document.getElementById('name').textContent = u.fullName || '—';
        document.getElementById('email').textContent = u.email || '—';
        document.getElementById('specialization').textContent = u.specialization || '—';
        document.getElementById('experience').textContent = u.experience || '—';
        document.getElementById('qualification').textContent = u.qualification || '—';
        document.getElementById('phone').textContent = u.phone || '—';
        document.getElementById('fee').textContent = u.consultationFee ? 'PKR ' + u.consultationFee : '—';
        document.getElementById('license').textContent = u.licenseNumber || '—';
        document.getElementById('since').textContent = u.createdAt
          ? new Date(u.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '—';

        // Profile live / draft badge
        const statusBadge = document.getElementById('profile-status-badge');
        if (u.profileCreated) {
          statusBadge.innerHTML = `<span class="status-badge status-live">✅ Profile Live</span>`;
        } else {
          statusBadge.innerHTML = `<span class="status-badge status-draft">⚠️ Profile Incomplete</span>`;
        }

      } catch (err) {
        document.getElementById('name').textContent = 'Failed to load';
        const errEl = document.getElementById('error-msg');
        errEl.textContent = 'Could not load profile. Please try again.';
        errEl.style.display = 'block';
      }
    }

    loadProfile();
  </script>

</body>
</html>
