<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Prescription - MindBridge</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    h2 {
      color: var(--teal);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button {
      margin-top: 20px;
      background: var(--teal);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #0b5e61;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🩺 Add Prescription</h2>

  <div class="form-group">
    <label>Diagnosis</label>
    <input type="text" id="diagnosis" placeholder="Enter diagnosis">
  </div>

  <div class="form-group">
    <label>Medicines</label>
    <textarea id="medicines" rows="3" placeholder="e.g. Paracetamol - 2 times daily"></textarea>
  </div>

  <div class="form-group">
    <label>Doctor Notes</label>
    <textarea id="notes" rows="3" placeholder="Additional advice..."></textarea>
  </div>

  <button onclick="submitPrescription()">Send to Patient</button>
</div>

<script src="/js/app.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const appointmentId = urlParams.get("id");

async function submitPrescription() {
  const diagnosis = document.getElementById("diagnosis").value.trim();
  const medicines = document.getElementById("medicines").value.trim();
  const notes = document.getElementById("notes").value.trim();

  if (!diagnosis || !medicines) {
    alert("Please fill all required fields");
    return;
  }

  try {
    const res = await apiCall(
      `/api/appointments/${appointmentId}/prescription`,
      "POST",
      { diagnosis, medicines, notes }
    );

    if (res.success) {
      alert("✅ Prescription sent successfully!");
      window.location.href = "/appointments";
    } else {
      alert(res.message);
    }
  } catch (err) {
    alert("Server error");
  }
}
</script>

</body>
</html>
