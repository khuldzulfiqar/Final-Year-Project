<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – MindBridge</title>
  <link rel="stylesheet" href="/css/admin-css/profile.css">
  <link rel="stylesheet" href="/css/admin-css/admin-dashboard.css">
  <style>
    .avatar-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0067b8, #00b4d8);
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .badge-patient {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.75rem;
      border-radius: 50px;
      margin-bottom: 18px;
    }
    .edit-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #0067b8;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .edit-link:hover { background: #0052a3; }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #0067b8;
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>
  </nav>

  <div class="page">

    <a id="back-link" href="/dashboard" class="back-link">← Back</a>

    <h2 class="title">My Profile</h2>

    <div class="cardd">

      <div class="avatar-circle" id="avatar-circle">?</div>
      <h3 id="name" class="name">Loading...</h3>
      <span class="badge-patient">Patient</span>

      <div class="info">

        <div class="row">
          <span>Email</span>
          <p id="email">—</p>
        </div>

        <div class="row">
          <span>CNIC</span>
          <p id="cnic">—</p>
        </div>

        <div class="row">
          <span>Age</span>
          <p id="age">—</p>
        </div>

        <div class="row">
          <span>Member Since</span>
          <p id="since">—</p>
        </div>

      </div>

      <p id="error-msg" class="error-msg" style="display:none;"></p>

      <a href="/register" class="edit-link">✏️ Edit Profile</a>

    </div>

  </div>

  <div id="footer-container"></div>
  <script src="/js/footer.js"></script>
  <script src="/js/app.js"></script>

  <script>
    async function loadProfile() {
      try {
        const params = new URLSearchParams(window.location.search);
        const patientId = params.get('id');

        let u;

        if (patientId) {
          // Admin view: load specific patient by ID (no auth check needed)
          const res = await fetch('/api/admin/patient/' + patientId);
          if (!res.ok) throw new Error('Patient not found');
          u = await res.json();
        } else {
          // Self view: must be logged in
          if (!Auth.isLoggedIn()) { window.location.href = '/login'; return; }
          const data = await apiCall('/api/auth/me');
          if (!data.success) { Auth.clear(); window.location.href = '/login'; return; }
          u = data.user;
        }

        const initial = (u.fullName || 'P').charAt(0).toUpperCase();
        document.getElementById('avatar-circle').textContent = initial;
        document.getElementById('name').textContent = u.fullName || '—';
        document.getElementById('email').textContent = u.email || '—';
        document.getElementById('cnic').textContent = u.cnic || '—';
        document.getElementById('age').textContent = u.age ? u.age + ' years' : '—';
        document.getElementById('since').textContent = u.createdAt
          ? new Date(u.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '—';

      } catch (err) {
        document.getElementById('name').textContent = 'Failed to load';
        const errEl = document.getElementById('error-msg');
        errEl.textContent = 'Could not load patient profile. Please go back and try again.';
        errEl.style.display = 'block';
      }
    }

    // Set back link based on context
        const params2 = new URLSearchParams(window.location.search);
        if (params2.get('id')) {
          document.getElementById('back-link').href = '/admin/manage-patients.html';
          document.getElementById('back-link').textContent = '← Back to Manage Patients';
        }
        loadProfile();
  </script>

</body>
</html>
