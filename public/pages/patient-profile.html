<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – MindBridge</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/admin-css/profile.css">
  <link rel="stylesheet" href="/css/admin-css/admin-dashboard.css">
</head>

<body>

<!-- NAVBAR (ADMIN FIXED) -->
<nav class="navbar">

  <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>

  <div class="nav-right">
    <button class="avatar-btn" id="avatarBtn">A</button>

    <div class="avatar-dropdown" id="avatarDropdown">
      <div class="dropdown-user">
        <!-- FIXED ADMIN ONLY -->
        <p>Admin</p>
        <span>admin@mindbridge.com</span>
      </div>

      <div class="dropdown-item logout-item" id="logoutBtn">
        <i class="ti ti-logout"></i> Logout
      </div>
    </div>
  </div>

</nav>

<!-- PAGE -->
<div class="page">

  <a id="back-link" href="/admin/manage-patients.html" class="back-link">← Back</a>

  <h2 class="title">Patient Profile</h2>

  <div class="cardd">

    <!-- USER AVATAR (FROM USER DATA) -->
    <div class="avatar-circle" id="avatar-circle">?</div>

    <h3 id="name" class="name">Loading...</h3>

    <span class="badge-patient">Patient</span>

    <div class="info">

      <div class="row">
        <span>Email</span>
        <p id="email">—</p>
      </div>

      <div class="row">
        <span>CNIC</span>
        <p id="cnic">—</p>
      </div>

      <div class="row">
        <span>Age</span>
        <p id="age">—</p>
      </div>

      <div class="row">
        <span>Member Since</span>
        <p id="since">—</p>
      </div>

    </div>

    <p id="error-msg" class="error-msg" style="display:none;"></p>

  </div>

</div>

<script>
  // DROPDOWN
  const avatarBtn = document.getElementById('avatarBtn');
  const avatarDropdown = document.getElementById('avatarDropdown');

  avatarBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    avatarDropdown.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    avatarDropdown?.classList.remove('show');
  });

  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", function () {
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = "/";
  });

  // LOAD PROFILE
  async function loadProfile() {
    try {
      const params = new URLSearchParams(window.location.search);
      const patientId = params.get('id');

      let u;

      if (patientId) {
        const res = await fetch('/api/admin/patient/' + patientId);
        u = await res.json();
      }

      // USER DATA
      const initial = (u.fullName || 'P').charAt(0).toUpperCase();

      document.getElementById('avatar-circle').textContent = initial;
      document.getElementById('name').textContent = u.fullName || '—';
      document.getElementById('email').textContent = u.email || '—';
      document.getElementById('cnic').textContent = u.cnic || '—';
      document.getElementById('age').textContent = u.age ? u.age + ' years' : '—';
      document.getElementById('since').textContent = u.createdAt
        ? new Date(u.createdAt).toLocaleDateString()
        : '—';

    } catch (err) {
      document.getElementById('name').textContent = 'Failed to load';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = "Could not load profile.";
    }
  }

  loadProfile();
</script>

</body>
</html>
