<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – MindBridge</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/admin-css/profile.css">
  <link rel="stylesheet" href="/css/admin-css/admin-dashboard.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>

  <div class="nav-right">
    <button class="avatar-btn" id="avatarBtn">U</button>

    <div class="avatar-dropdown" id="avatarDropdown">
      <div class="dropdown-user">
        <p id="nav-name">User</p>
        <span id="nav-email">email</span>
      </div>

      <div class="dropdown-item logout-item" id="logoutBtn">
        <i class="ti ti-logout"></i> Logout
      </div>
    </div>
  </div>
</nav>

<!-- PAGE -->
<div class="page">

  <a href="#" onclick="goBack(event)" class="back-link">← Back</a>

  <h2 class="title">My Profile</h2>

  <div class="cardd">
    <div class="avatar-circle" id="avatar-circle">?</div>

    <h3 id="name" class="name">Loading...</h3>

    <span class="badge-patient" id="role-badge">User</span>

    <div class="info">
      <div class="row">
        <span>Email</span>
        <p id="email">—</p>
      </div>

      <div class="row">
        <span>CNIC</span>
        <p id="cnic">—</p>
      </div>

      <div class="row">
        <span>Age</span>
        <p id="age">—</p>
      </div>

      <div class="row">
        <span>Member Since</span>
        <p id="since">—</p>
      </div>
    </div>

    <p id="error-msg" class="error-msg" style="display:none;"></p>
  </div>
</div>

<script src="/js/app.js"></script>

<script>
// ================= DROPDOWN =================
const avatarBtn = document.getElementById('avatarBtn');
const avatarDropdown = document.getElementById('avatarDropdown');

avatarBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  avatarDropdown.classList.toggle('show');
});

document.addEventListener('click', () => {
  avatarDropdown.classList.remove('show');
});

// ================= LOGOUT =================
document.getElementById("logoutBtn").addEventListener("click", function () {
  localStorage.clear();
  window.location.href = "/";
});

// ================= BACK =================
function goBack(e) {
  e.preventDefault();

  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) return window.location.href = "/login";

  if (user.role === "admin") {
    window.location.href = "/admin/manage-patients.html";
  } 
  else if (user.role === "psychiatrist") {
    window.location.href = "/appointments.html";
  } 
  else {
    window.location.href = "/dashboard";
  }
}

// ================= LOAD PROFILE =================
async function loadProfile() {
  try {
    const res = await apiCall('/api/auth/me'); // 🔥 IMPORTANT
    const user = res.user;

    if (!user) throw new Error("No user");

    // NAVBAR
    document.getElementById("nav-name").textContent = user.fullName;
    document.getElementById("nav-email").textContent = user.email;

    // AVATAR
    const initial = user.fullName?.charAt(0).toUpperCase() || "U";
    document.getElementById("avatarBtn").textContent = initial;
    document.getElementById("avatar-circle").textContent = initial;

    // PROFILE
    document.getElementById('name').textContent = user.fullName || '—';
    document.getElementById('email').textContent = user.email || '—';
    document.getElementById('cnic').textContent = user.cnic || '—';
    document.getElementById('age').textContent = user.age ? user.age + ' years' : '—';
    document.getElementById('since').textContent = user.createdAt
      ? new Date(user.createdAt).toLocaleDateString()
      : '—';

    document.getElementById('role-badge').textContent =
      user.role.charAt(0).toUpperCase() + user.role.slice(1);

  } catch (err) {
    document.getElementById('name').textContent = 'Failed to load';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = "Could not load profile.";
  }
}

loadProfile();
</script>

</body>
</html>
