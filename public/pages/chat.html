<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — MindBridge</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .chat-shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 70px - 2rem);
      min-height: 420px;
      max-width: 1140px;
      margin: 1rem auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* ── contact list ── */
    .chat-sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-sidebar-head {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .chat-sidebar-head h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--charcoal);
    }

    .chat-sidebar-head a {
      font-size: 0.8rem;
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }

    .chat-filter { display: none; padding: 0.6rem 1.1rem; border-bottom: 1px solid var(--border); }
    .chat-filter input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 0.45rem 0.7rem; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; outline: none;
    }
    .chat-filter input:focus { border-color: var(--teal); }
    .filter-tabs { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .filter-tab {
      border: 1px solid var(--border); background: white; border-radius: 50px;
      padding: 0.2rem 0.7rem; font-size: 0.74rem; cursor: pointer; color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
    }
    .filter-tab.active { background: var(--teal); color: white; border-color: var(--teal); }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .contact {
      display: flex;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      border-bottom: 1px solid #f0eee9;
      transition: background 0.15s;
    }

    .contact:hover {
      background: rgba(13, 115, 119, 0.04);
    }

    .contact.active {
      background: rgba(13, 115, 119, 0.09);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .contact-body {
      flex: 1;
      min-width: 0;
    }

    .contact-top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: baseline;
    }

    .contact-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .contact-bottom {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.1rem;
    }

    .contact-last {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background: var(--teal);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .list-empty {
      padding: 2rem 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ── conversation ── */
    .chat-main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .chat-head-name {
      font-weight: 700;
      color: var(--charcoal);
      font-size: 0.95rem;
    }

    .chat-head-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .back-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--teal);
      padding: 0 0.3rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      background: #f7f5f0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .chat-placeholder {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1rem;
    }

    .chat-placeholder .big {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .msg {
      max-width: 70%;
      padding: 0.55rem 0.85rem;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.mine {
      align-self: flex-end;
      background: var(--teal);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.theirs {
      align-self: flex-start;
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg .time {
      display: block;
      font-size: 0.66rem;
      opacity: 0.7;
      margin-top: 0.2rem;
      text-align: right;
    }

    .date-sep {
      align-self: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: #ece9e2;
      padding: 0.15rem 0.75rem;
      border-radius: 50px;
      margin: 0.5rem 0;
    }

    .chat-compose {
      border-top: 1px solid var(--border);
      padding: 0.75rem 1rem 0.5rem;
    }

    .compose-row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }

    .compose-row textarea {
      flex: 1;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      max-height: 120px;
      outline: none;
    }

    .compose-row textarea:focus {
      border-color: var(--teal);
    }

    .send-btn {
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.65rem 1.2rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--teal-dark);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .attach-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--teal);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .attach-btn:hover:not(:disabled) { background: rgba(13, 115, 119, 0.08); border-color: var(--teal); }
    .attach-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .attach-preview {
      display: none;
      align-items: center;
      gap: 0.7rem;
      background: #f7f5f0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.5rem 0.65rem;
      margin-bottom: 0.6rem;
    }

    .attach-preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .attach-preview .file-icon { width: 48px; height: 48px; font-size: 1.5rem; }
    .attach-preview .attach-info { flex: 1; min-width: 0; }
    .attach-preview .attach-name { font-size: 0.85rem; font-weight: 600; color: var(--charcoal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .attach-preview .attach-size { font-size: 0.72rem; color: var(--text-muted); }
    .attach-remove { background: none; border: none; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text-muted); padding: 0.2rem 0.4rem; }
    .attach-remove:hover { color: #c0392b; }

    .file-icon {
      width: 40px; height: 40px; border-radius: 10px; background: rgba(13, 115, 119, 0.12);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0;
    }

    /* attachments inside message bubbles */
    .msg-image { display: block; margin-bottom: 0.3rem; }
    .msg-image img { display: block; max-width: 260px; width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: #e9e6df; }
    .file-card {
      display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit;
      background: rgba(0, 0, 0, 0.06); border-radius: 10px; padding: 0.5rem 0.6rem; margin-bottom: 0.3rem; min-width: 190px;
    }
    .msg.mine .file-card { background: rgba(255, 255, 255, 0.18); }
    .file-card:hover { filter: brightness(0.96); }
    .file-card .file-icon { background: rgba(255, 255, 255, 0.85); }
    .file-card-info { min-width: 0; }
    .file-card-name { font-size: 0.84rem; font-weight: 600; overflow-wrap: anywhere; }
    .file-card-size { font-size: 0.7rem; opacity: 0.75; }
    .msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }

    .compose-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .compose-error {
      font-size: 0.78rem;
      color: #c0392b;
      margin-bottom: 0.4rem;
      display: none;
    }

    @media (max-width: 768px) {
      .chat-shell {
        grid-template-columns: 1fr;
        height: calc(100vh - 70px);
        margin: 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      .chat-main {
        display: none;
      }

      .chat-shell.show-chat .chat-sidebar {
        display: none;
      }

      .chat-shell.show-chat .chat-main {
        display: flex;
      }

      .back-btn {
        display: block;
      }

      .msg {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Mind<span>Bridge</span></a>
    <div class="nav-links" id="dynamic-nav"></div>
  </nav>

  <div class="chat-shell" id="chat-shell">
    <!-- contacts -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar-head">
        <h2>Messages</h2>
        <a href="/dashboard" id="back-link">← Back to Dashboard</a>
      </div>
      <div class="chat-filter" id="chat-filter">
        <input type="text" id="contact-search" placeholder="Search conversations…">
        <div class="filter-tabs">
          <button class="filter-tab active" data-role="all" onclick="setRoleFilter('all')">All</button>
          <button class="filter-tab" data-role="patient" onclick="setRoleFilter('patient')">Patients</button>
          <button class="filter-tab" data-role="psychiatrist" onclick="setRoleFilter('psychiatrist')">Psychiatrists</button>
        </div>
      </div>
      <div class="chat-list" id="chat-list">
        <div class="list-empty">Loading…</div>
      </div>
    </aside>

    <!-- conversation -->
    <section class="chat-main">
      <div class="chat-head" id="chat-head" style="display:none;">
        <button class="back-btn" onclick="closeChatMobile()" aria-label="Back to conversations">←</button>
        <div class="avatar" id="head-avatar"></div>
        <div>
          <div class="chat-head-name" id="head-name"></div>
          <div class="chat-head-sub" id="head-sub"></div>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-placeholder">
          <div class="big">💬</div>
          Select a conversation to start chatting.
        </div>
      </div>

      <div class="chat-compose" id="chat-compose" style="display:none;">
        <div class="compose-error" id="compose-error"></div>
        <div class="attach-preview" id="attach-preview"></div>
        <div class="compose-row">
          <button type="button" class="attach-btn" id="attach-btn" title="Attach a file or image" aria-label="Attach a file or image"
            onclick="document.getElementById('file-input').click()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" hidden
            accept="image/jpeg,image/png,image/gif,image/webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv">
          <textarea id="msg-input" rows="1" maxlength="1000" placeholder="Type a message…"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div class="compose-note" id="compose-note">Enter to send · Shift+Enter for a new line · Attach images or documents up to 10 MB. This chat is not for emergencies — in a crisis,
          contact your local emergency services.</div>
      </div>
    </section>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!Auth.isLoggedIn()) window.location.href = '/login';

    const IS_ADMIN = Auth.isAdmin();
    let roleFilter = 'all';
    let searchTerm = '';

    let contacts = [];
    let activeId = null;
    let lastMessageId = null;
    let renderedIds = new Set();
    let lastDateKey = null;
    let sending = false;

    const POLL_MESSAGES_MS = 3000;
    const POLL_CONTACTS_MS = 10000;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function initial(name) {
      return esc((name || '?').replace(/^Dr\.\s*/, '').charAt(0).toUpperCase());
    }

    function shortTime(iso) {
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString())
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function dateLabel(d) {
      const today = new Date();
      const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return 'Today';
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    /* ───────── contacts ───────── */
    async function loadContacts() {
      try {
        const data = await apiCall('/api/chat/contacts');
        if (!data.success) throw new Error(data.message);
        contacts = data.contacts;
        renderContacts();
        refreshChatBadge();
      } catch (e) {
        if (!contacts.length)
          document.getElementById('chat-list').innerHTML = '<div class="list-empty">Could not load conversations.</div>';
      }
    }

    function renderContacts() {
      const list = document.getElementById('chat-list');
      let shown = contacts;
      if (IS_ADMIN && contacts.length === 0) {
        list.innerHTML = '<div class="list-empty">💬<br>No messages yet. Users will appear here when they contact you using the Contact Us button.</div>';
        return;
      }
      if (IS_ADMIN) {
        shown = contacts.filter(c =>
          (roleFilter === 'all' || c.role === roleFilter) &&
          (!searchTerm || c.name.toLowerCase().includes(searchTerm)));
        if (shown.length === 0) {
          list.innerHTML = '<div class="list-empty">No matching conversations.</div>';
          return;
        }
      }
      if (contacts.length === 0) {
        const msg = Auth.isPsychiatrist()
          ? 'No conversations yet. You can chat with a patient once you accept their appointment request.'
          : 'No conversations yet. You can chat with a psychiatrist once they accept your appointment.';
        list.innerHTML = `<div class="list-empty">💬<br>${msg}</div>`;
        return;
      }
      list.innerHTML = shown.map(c => `
        <div class="contact ${c._id === activeId ? 'active' : ''}" onclick="openChat('${c._id}')">
          <div class="avatar">${initial(c.name)}</div>
          <div class="contact-body">
            <div class="contact-top">
              <span class="contact-name">${esc(c.name)}</span>
              <span class="contact-time">${c.lastMessage ? shortTime(c.lastMessage.createdAt) : ''}</span>
            </div>
            <div class="contact-bottom">
              <span class="contact-last">${c.lastMessage
          ? (c.lastMessage.mine ? 'You: ' : '') + esc(c.lastMessage.text)
          : esc(c.subtitle)}</span>
              ${c.unread > 0 && c._id !== activeId ? `<span class="unread-badge">${c.unread}</span>` : ''}
            </div>
          </div>
        </div>`).join('');
    }

    /* ───────── conversation ───────── */
    async function openChat(id) {
      activeId = id;
      lastMessageId = null;
      renderedIds = new Set();
      lastDateKey = null;

      document.getElementById('chat-shell').classList.add('show-chat');
      history.replaceState(null, '', `/chat?with=${id}`);

      const box = document.getElementById('chat-messages');
      box.innerHTML = '<div class="chat-placeholder">Loading…</div>';
      document.getElementById('compose-error').style.display = 'none';
      clearPendingFile();

      try {
        const data = await apiCall(`/api/chat/${id}/messages`);
        if (activeId !== id) return; // user switched while loading
        if (!data.success) {
          document.getElementById('chat-head').style.display = 'none';
          document.getElementById('chat-compose').style.display = 'none';
          box.innerHTML = `<div class="chat-placeholder"><div class="big">🔒</div>${esc(data.message || 'Cannot open this chat.')}</div>`;
          return;
        }

        document.getElementById('chat-head').style.display = 'flex';
        document.getElementById('chat-compose').style.display = 'block';
        document.getElementById('head-avatar').textContent = data.other.name.replace(/^Dr\.\s*/, '').charAt(0).toUpperCase();
        document.getElementById('head-name').textContent = data.other.name;
        document.getElementById('head-sub').textContent = data.other.subtitle;

        box.innerHTML = '';
        if (data.messages.length === 0) {
          box.innerHTML = '<div class="chat-placeholder" id="no-msgs"><div class="big">👋</div>No messages yet. Say hello!</div>';
        } else {
          data.messages.forEach(appendMessage);
        }
        scrollToBottom(true);
        document.getElementById('msg-input').focus();

        // opening a chat marks it read
        const c = contacts.find(x => x._id === id);
        if (c) c.unread = 0;
        renderContacts();
        refreshChatBadge();
      } catch (e) {
        box.innerHTML = '<div class="chat-placeholder">Could not load messages.</div>';
      }
    }

    function closeChatMobile() {
      document.getElementById('chat-shell').classList.remove('show-chat');
      activeId = null;
      history.replaceState(null, '', '/chat');
      renderContacts();
    }

    /* ───────── attachments ───────── */
    const MAX_FILE_BYTES = 10 * 1024 * 1024;
    const ALLOWED_EXT = /\.(jpe?g|png|gif|webp|pdf|docx?|xlsx?|pptx?|txt|csv)$/i;
    let pendingFile = null;
    let pendingPreviewUrl = null;

    function fmtSize(b) {
      if (!b && b !== 0) return '';
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
      return (b / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function fileEmoji(name, mime) {
      const n = (name || '').toLowerCase();
      if (/pdf$/.test(n) || mime === 'application/pdf') return '📕';
      if (/\.(docx?)$/.test(n)) return '📘';
      if (/\.(xlsx?|csv)$/.test(n)) return '📗';
      if (/\.(pptx?)$/.test(n)) return '📙';
      return '📄';
    }

    // only ever link to https URLs
    const safeUrl = u => (/^https:\/\//i.test(u || '') ? u : '#');

    function buildAttachment(a) {
      if (a.kind === 'image') {
        const link = document.createElement('a');
        link.className = 'msg-image';
        link.href = safeUrl(a.url);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        const img = document.createElement('img');
        img.src = safeUrl(a.url);
        img.alt = a.name || 'Shared image';
        img.loading = 'lazy';
        img.addEventListener('load', () => scrollToBottom(false));
        link.appendChild(img);
        return link;
      }
      const card = document.createElement('a');
      card.className = 'file-card';
      card.href = safeUrl(a.url);
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      const icon = document.createElement('div');
      icon.className = 'file-icon';
      icon.textContent = fileEmoji(a.name, a.mimeType);
      const info = document.createElement('div');
      info.className = 'file-card-info';
      const nm = document.createElement('div');
      nm.className = 'file-card-name';
      nm.textContent = a.name || 'File';
      const sz = document.createElement('div');
      sz.className = 'file-card-size';
      sz.textContent = fmtSize(a.size);
      info.append(nm, sz);
      card.append(icon, info);
      return card;
    }

    function showComposeError(msg) {
      const errEl = document.getElementById('compose-error');
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    function setPendingFile(file) {
      if (!file) return;
      if (!ALLOWED_EXT.test(file.name) && !file.type.startsWith('image/')) {
        showComposeError('This file type is not allowed. Send an image, PDF, Word, Excel, PowerPoint, TXT or CSV file.');
        return;
      }
      if (file.size > MAX_FILE_BYTES) {
        showComposeError('File is too large (max 10 MB).');
        return;
      }
      document.getElementById('compose-error').style.display = 'none';
      clearPendingFile();
      pendingFile = file;
      if (file.type.startsWith('image/')) pendingPreviewUrl = URL.createObjectURL(file);
      renderAttachPreview();
    }

    function clearPendingFile() {
      if (pendingPreviewUrl) URL.revokeObjectURL(pendingPreviewUrl);
      pendingFile = null;
      pendingPreviewUrl = null;
      document.getElementById('file-input').value = '';
      renderAttachPreview();
    }

    function renderAttachPreview() {
      const box = document.getElementById('attach-preview');
      box.innerHTML = '';
      if (!pendingFile) { box.style.display = 'none'; return; }

      let thumb;
      if (pendingPreviewUrl) {
        thumb = document.createElement('img');
        thumb.src = pendingPreviewUrl;
        thumb.alt = '';
      } else {
        thumb = document.createElement('div');
        thumb.className = 'file-icon';
        thumb.textContent = fileEmoji(pendingFile.name, pendingFile.type);
      }
      const info = document.createElement('div');
      info.className = 'attach-info';
      const nm = document.createElement('div');
      nm.className = 'attach-name';
      nm.textContent = pendingFile.name;
      const sz = document.createElement('div');
      sz.className = 'attach-size';
      sz.textContent = fmtSize(pendingFile.size);
      info.append(nm, sz);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'attach-remove';
      rm.setAttribute('aria-label', 'Remove attachment');
      rm.textContent = '✕';
      rm.onclick = clearPendingFile;
      box.append(thumb, info, rm);
      box.style.display = 'flex';
    }

    function appendMessage(m) {
      if (renderedIds.has(m._id)) return;
      renderedIds.add(m._id);
      lastMessageId = m._id;

      const box = document.getElementById('chat-messages');
      const noMsgs = document.getElementById('no-msgs');
      if (noMsgs) noMsgs.remove();

      const d = new Date(m.createdAt);
      const key = d.toDateString();
      if (key !== lastDateKey) {
        lastDateKey = key;
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.textContent = dateLabel(d);
        box.appendChild(sep);
      }

      const el = document.createElement('div');
      el.className = `msg ${m.mine ? 'mine' : 'theirs'}`;
      if (m.attachment) el.appendChild(buildAttachment(m.attachment));
      if (m.text) {
        const tx = document.createElement('div');
        tx.className = 'msg-text';
        tx.textContent = m.text;                          // text only — never HTML
        el.appendChild(tx);
      }
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.appendChild(t);
      box.appendChild(el);
    }

    function scrollToBottom(force) {
      const box = document.getElementById('chat-messages');
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      if (force || nearBottom) box.scrollTop = box.scrollHeight;
    }

    async function pollMessages() {
      if (!activeId || document.hidden) return;
      const id = activeId;
      try {
        const url = `/api/chat/${id}/messages` + (lastMessageId ? `?after=${lastMessageId}` : '');
        const data = await apiCall(url);
        if (!data.success || activeId !== id) return;
        if (data.messages.length > 0) {
          const box = document.getElementById('chat-messages');
          const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
          data.messages.forEach(appendMessage);
          if (wasNearBottom) box.scrollTop = box.scrollHeight;
          loadContacts();
        }
      } catch (e) { /* ignore — next poll will retry */ }
    }

    /* ───────── sending ───────── */
    async function sendMessage() {
      if (sending || !activeId) return;
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text && !pendingFile) return;

      const errEl = document.getElementById('compose-error');
      const sendBtn = document.getElementById('send-btn');
      errEl.style.display = 'none';
      sending = true;
      sendBtn.disabled = true;
      document.getElementById('attach-btn').disabled = true;
      if (pendingFile) sendBtn.textContent = 'Sending…';

      try {
        const fd = new FormData();
        if (text) fd.append('text', text);
        if (pendingFile) fd.append('file', pendingFile);

        // multipart upload: let the browser set the Content-Type boundary (so no apiCall here)
        const res = await fetch(`/api/chat/${activeId}/messages`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${Auth.getToken()}` },
          body: fd
        });
        let data;
        try { data = await res.json(); }
        catch { data = { success: false, message: res.status === 413 ? 'File is too large (max 10 MB).' : 'Could not send message.' }; }

        if (data.success) {
          input.value = '';
          input.style.height = 'auto';
          clearPendingFile();
          appendMessage(data.message);
          scrollToBottom(true);
          loadContacts();
        } else {
          showComposeError(data.message || 'Could not send message.');
        }
      } catch (e) {
        showComposeError('Network error. Please try again.');
      } finally {
        sending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
        document.getElementById('attach-btn').disabled = false;
        input.focus();
      }
    }

    document.getElementById('file-input').addEventListener('change', e => setPendingFile(e.target.files[0]));

    const msgInput = document.getElementById('msg-input');
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    msgInput.addEventListener('paste', e => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
      if (item) { e.preventDefault(); setPendingFile(item.getAsFile()); }
    });
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    });

    /* ───────── start ───────── */
    function setRoleFilter(role) {
      roleFilter = role;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
      renderContacts();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (IS_ADMIN) {
        document.getElementById('chat-filter').style.display = 'block';
        const back = document.getElementById('back-link');
        back.href = '/admin/admin-dashboard.html';
        back.textContent = '← Back to Admin Dashboard';
        document.getElementById('compose-note').textContent = 'Enter to send · Shift+Enter for a new line.';
        document.getElementById('contact-search').addEventListener('input', e => {
          searchTerm = e.target.value.trim().toLowerCase();
          renderContacts();
        });
      }
      await loadContacts();

      const withId = new URLSearchParams(window.location.search).get('with');
      if (withId) openChat(withId);
      else if (window.innerWidth > 768 && contacts.length > 0 && (!IS_ADMIN || contacts.some(c => c.unread > 0))) {
        // desktop: open the most recent conversation (or the first one with unread messages)
        const firstUnread = contacts.find(c => c.unread > 0);
        openChat((firstUnread || contacts[0])._id);
      }

      setInterval(pollMessages, POLL_MESSAGES_MS);
      setInterval(loadContacts, POLL_CONTACTS_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollMessages(); loadContacts(); } });
    });
  </script>
</body>

</html>
